<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>国科信 - 我的内容记录</title>
  <style>
    :root {
      --brand: #165DFF;
      --brand-hover: #4080FF;
      --brand-active: #0E42D2;
      --brand-light: #E8F3FF;
      --bg-page: #D8E7FC;
      --surface: #FFFFFF;
      --module: #F7F8FA;
      --subtle: #F2F3F5;
      --text-1: #1D2129;
      --text-2: #4E5969;
      --text-3: #86909C;
      --text-4: #C9CDD4;
      --border: #E5E6EB;
      --success: #00B42A;
      --warning: #FF7D00;
      --danger: #F53F3F;
      --radius: 6px;
      font-family: "PingFang SC", "PingFang HK", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 1280px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.78) 0, rgba(255,255,255,.36) 38%, rgba(255,255,255,.18) 100%),
        var(--bg-page);
      color: var(--text-1);
      font-size: 14px;
      line-height: 22px;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
    }

    .sidebar {
      background: rgba(255, 255, 255, .62);
      border-right: 1px solid rgba(198, 212, 232, .7);
      display: flex;
      flex-direction: column;
    }

    .brand {
      height: 74px;
      padding: 23px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(198, 212, 232, .64);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 600;
    }

    .brand-title {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
    }

    .brand-subtitle {
      color: var(--text-3);
      font-size: 12px;
      line-height: 18px;
      margin-top: 2px;
      white-space: nowrap;
    }

    .nav {
      padding: 10px;
    }

    .nav-item {
      height: 42px;
      border-radius: 6px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-2);
      font-size: 15px;
      font-weight: 500;
      margin: 4px 0;
      cursor: default;
    }

    .nav-item.active {
      background: linear-gradient(90deg, #E8F3FF, rgba(232,243,255,.58));
      color: var(--brand);
    }

    .nav-item .icon {
      width: 18px;
      height: 18px;
      color: currentColor;
      flex: 0 0 auto;
    }

    .nav-spacer {
      flex: 1;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      padding: 0 24px;
      background: rgba(255,255,255,.62);
      border-bottom: 1px solid rgba(198, 212, 232, .64);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-icon {
      width: 22px;
      height: 22px;
      color: var(--text-2);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .auth-pill {
      height: 32px;
      padding: 0 14px;
      border-radius: 18px;
      border: 1px solid #C9D5E6;
      background: rgba(255,255,255,.72);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C3CAD4, #A8B0BC);
    }

    .account {
      max-width: 210px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-1);
      font-weight: 500;
    }

    .page-head {
      height: 60px;
      padding: 0 24px;
      background: rgba(255,255,255,.62);
      border-bottom: 1px solid rgba(198, 212, 232, .64);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .page-head h1 {
      margin: 0;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
    }

    .content {
      padding: 20px 24px 28px;
      min-height: calc(100vh - 116px);
    }

    .workspace {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 16px;
      max-width: 1440px;
    }

    .inner-tabs {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(229,230,235,.8);
      border-radius: 8px;
      padding: 8px;
      height: fit-content;
    }

    .tab {
      height: 42px;
      border-radius: 6px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      color: var(--text-2);
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 8px;
      white-space: nowrap;
      border: 0;
      background: transparent;
      width: 100%;
      cursor: pointer;
    }

    .tab:last-child {
      margin-bottom: 0;
    }

    .tab.active {
      background: linear-gradient(90deg, #E8F3FF, rgba(232,243,255,.6));
      color: var(--brand);
    }

    .tab:focus-visible {
      outline: 2px solid rgba(22, 93, 255, .24);
    }

    .panel {
      min-height: 690px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid rgba(229,230,235,.88);
      padding: 24px;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-head h2 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 26px;
      font-weight: 600;
    }

    .muted {
      color: var(--text-3);
      font-size: 13px;
      line-height: 20px;
    }

    .btn {
      height: 32px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-2);
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .btn:hover {
      color: var(--brand);
      border-color: var(--brand-hover);
    }

    .btn.primary:hover {
      color: #fff;
      background: var(--brand-hover);
    }

    .overview {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      background: var(--module);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
    }

    .metric-label {
      color: var(--text-3);
      font-size: 13px;
      line-height: 20px;
    }

    .metric-value {
      margin-top: 8px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
    }

    .metric-unit {
      color: var(--text-3);
      font-size: 12px;
      font-weight: 400;
    }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr);
      gap: 16px;
    }

    .category-bar {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 8px;
    }

    .category {
      height: 52px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      text-align: left;
    }

    .category:focus-visible {
      outline: 2px solid rgba(22, 93, 255, .24);
      border-color: var(--brand);
    }

    .category.active {
      border-color: #BEDAFF;
      background: #F2F7FF;
      color: var(--brand);
    }

    .category-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-count {
      margin-top: 2px;
      color: var(--text-3);
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
    }

    .toolbar {
      height: 56px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .filter {
      height: 32px;
      border: 1px solid #C9D5E6;
      border-radius: 4px;
      padding: 0 12px;
      background: #fff;
      color: var(--text-2);
      min-width: 120px;
    }

    .block {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      min-width: 0;
    }

    .block-head {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .block-title {
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .link {
      color: var(--brand);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .tag-area {
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      height: 28px;
      border-radius: 4px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #BEDAFF;
      background: #F2F7FF;
      color: var(--brand);
      white-space: nowrap;
    }

    .tag.neutral {
      border-color: var(--border);
      background: var(--module);
      color: var(--text-2);
    }

    .tag.warning {
      border-color: #FFD8A8;
      background: #FFF7E8;
      color: #D25F00;
    }

    .empty {
      height: 160px;
      display: grid;
      place-items: center;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-2);
      vertical-align: middle;
    }

    th {
      background: var(--module);
      color: var(--text-1);
      font-weight: 500;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    tbody tr.clickable {
      cursor: pointer;
    }

    tbody tr.clickable:hover td {
      background: #F7FBFF;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      flex: 0 0 auto;
    }

    .dot.warn { background: var(--warning); }
    .dot.danger { background: var(--danger); }
    .dot.gray { background: var(--text-4); }

    .rules {
      padding: 8px 16px 16px;
    }

    .rule {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .rule:last-child {
      border-bottom: 0;
    }

    .rule-title {
      font-weight: 500;
      color: var(--text-1);
    }

    .rule-desc {
      color: var(--text-3);
      font-size: 13px;
      line-height: 20px;
      margin-top: 2px;
    }

    .switch {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--brand);
      position: relative;
      margin-top: 2px;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
    }

    .switch.off {
      background: var(--text-4);
    }

    .switch.off::after {
      left: 2px;
      right: auto;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .form {
      padding: 16px;
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr);
      gap: 16px 12px;
      align-items: center;
    }

    .label {
      color: var(--text-2);
      text-align: right;
    }

    .input, .select {
      height: 32px;
      border: 1px solid #C9D5E6;
      border-radius: 4px;
      padding: 0 12px;
      color: var(--text-1);
      background: #fff;
      width: 100%;
    }

    .hint {
      color: var(--text-3);
      font-size: 12px;
      line-height: 20px;
      margin-top: 4px;
    }

    .footer-actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .drawer-mask {
      position: fixed;
      inset: 0;
      background: rgba(29, 33, 41, .22);
      display: none;
      justify-content: flex-end;
      z-index: 20;
    }

    .drawer-mask.open {
      display: flex;
    }

    .drawer {
      width: 520px;
      height: 100%;
      background: #fff;
      box-shadow: -8px 0 24px rgba(29, 33, 41, .12);
      display: flex;
      flex-direction: column;
    }

    .drawer-head {
      height: 56px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      color: var(--text-2);
      cursor: pointer;
    }

    .drawer-body {
      padding: 24px;
      overflow: auto;
      flex: 1;
    }

    .detail-title {
      margin: 0;
      font-size: 18px;
      line-height: 26px;
      font-weight: 600;
    }

    .detail-meta {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 12px 16px;
      color: var(--text-2);
    }

    .detail-label {
      color: var(--text-3);
      text-align: right;
    }

    .detail-summary {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 6px;
      background: var(--module);
      color: var(--text-2);
    }

    .drawer-foot {
      height: 64px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 16px;
    }

    @media (max-width: 1360px) {
      body { min-width: 1180px; }
      .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .category-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .grid, .two-col { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      body { min-width: 320px; }

      .app { grid-template-columns: minmax(0, 1fr); }
      .sidebar { display: none; }

      .topbar {
        min-height: 56px;
        padding: 0 16px;
      }

      .account { display: none; }

      .page-head {
        min-height: 60px;
        height: auto;
        gap: 12px;
        padding: 12px 16px;
      }

      .content {
        min-height: calc(100vh - 116px);
        padding: 12px;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }

      .inner-tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 6px;
        scrollbar-width: thin;
      }

      .tab {
        width: auto;
        min-width: max-content;
        flex: 0 0 auto;
        margin: 0;
      }

      .panel {
        min-height: 0;
        padding: 16px;
      }

      .section-head {
        flex-direction: column;
        align-items: stretch;
      }

      .section-head > div:last-child {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .category-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .toolbar {
        height: auto;
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }

      .filters {
        width: 100%;
        flex-wrap: wrap;
      }

      .filter {
        min-width: 132px;
        flex: 1 1 132px;
      }

      table { min-width: 680px; }

      .drawer { width: min(520px, 100%); }
    }

    @media (max-width: 520px) {
      .top-actions { gap: 10px; }
      .auth-pill { display: none; }

      .page-head h1 { font-size: 18px; }

      .panel { padding: 12px; }

      .overview,
      .category-bar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric { padding: 12px; }
      .metric-value { font-size: 21px; }

      .section-head > div:last-child .btn {
        flex: 1 1 140px;
      }

      .footer-actions {
        flex-wrap: wrap;
        gap: 8px;
      }

      .footer-actions .btn { flex: 1 1 140px; }

      .drawer-head,
      .drawer-body,
      .drawer-foot {
        padding-right: 16px;
        padding-left: 16px;
      }

      .detail-meta {
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">G</div>
        <div>
          <div class="brand-title">国科信</div>
          <div class="brand-subtitle">清华大学深圳研究院</div>
        </div>
      </div>

      <nav class="nav" aria-label="侧边导航">
        <div class="nav-item active">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>
            <path d="M4 20a8 8 0 0 1 16 0"></path>
          </svg>
          <span>我的账户</span>
        </div>
        <div class="nav-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M4 21V7l8-4 8 4v14"></path>
            <path d="M9 21v-8h6v8"></path>
            <path d="M7 9h.01M17 9h.01"></path>
          </svg>
          <span>组织机构</span>
          <span class="nav-spacer"></span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="m7 10 5 5 5-5"></path>
          </svg>
        </div>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <div class="top-actions">
          <div class="auth-pill">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M12 3 8 7v5a4 4 0 0 0 8 0V7l-4-4Z"></path>
              <path d="M8 7h8"></path>
              <path d="M7 16a6 6 0 0 0 10 0"></path>
            </svg>
            机构认证
          </div>
          <div class="avatar" aria-hidden="true"></div>
          <div class="account">a1059778569@163.com</div>
        </div>
      </header>

      <div class="page-head">
        <h1>我的账户</h1>
        <button class="btn primary">导出记录</button>
      </div>

      <section class="content">
        <div class="workspace">
          <aside class="inner-tabs" aria-label="账户设置">
            <button class="tab" data-section="profile">基本信息</button>
            <button class="tab active" data-section="favoriteSection">我的收藏</button>
            <button class="tab" data-section="browseSection">浏览记录</button>
            <button class="tab" data-section="followSection">我的关注</button>
          </aside>

          <div class="panel">
            <div class="section-head">
              <div>
                <h2>我的收藏</h2>
                <div class="muted">展示用户自己收藏、浏览和关注的数据；推荐规则、触达策略和算法参数由后台统一配置。</div>
              </div>
              <div>
                <button class="btn">批量移除</button>
                <button class="btn primary">查看推荐内容</button>
              </div>
            </div>

            <div class="overview" aria-label="内容记录概览">
              <div class="metric">
                <div class="metric-label">收藏内容</div>

    let activeType = "资讯";
    let currentDetailKey = "";
    const removedBrowse = new Set();
    const removedFavorite = new Set();
    const removedFollow = new Set();

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char];
      });
    }

    function dotClass(color) {
      if (color === "orange") return " warn";
      if (color === "gray") return " gray";
      return "";
    }

    function renderRows(tbody, rows, columns, emptyText) {
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${columns}" class="empty">${emptyText}</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.join("");
    }

    function renderPage() {
      const data = typeData[activeType];
      document.querySelectorAll(".category").forEach(function(item) {
        item.classList.toggle("active", item.dataset.type === activeType);
      });
      document.getElementById("browseTypeFilter").value = activeType;
      document.getElementById("favoriteTypeFilter").value = activeType;
      document.getElementById("favoriteTotal").textContent = data.favorite;
      document.getElementById("browseTotal").textContent = data.browse;
      document.getElementById("followTotal").textContent = data.follow;
      document.getElementById("weekTotal").textContent = data.week;

      const browseRows = data.browseRows
        .map(function(row, index) {
          const key = `${activeType}-${index}`;
          if (removedBrowse.has(key)) return "";
          return `<tr class="clickable" data-action="open-detail" data-key="${key}" title="点击查看浏览详情">
            <td>${escapeHtml(row[0])}</td>
            <td title="${escapeHtml(row[1])}">${escapeHtml(row[1])}</td>
            <td title="${escapeHtml(row[2])}">${escapeHtml(row[2])}</td>
            <td>${escapeHtml(row[3])}</td>
            <td><button class="link" data-action="open-detail" data-key="${key}">查看</button>　<button class="link" data-action="remove-browse" data-key="${key}">移除</button></td>
          </tr>`;
        })
        .filter(Boolean);
      renderRows(document.getElementById("browseRows"), browseRows, 5, "暂无该类型浏览记录");

      document.getElementById("followTags").innerHTML = data.followTags
        .map(function(name, index) {
          const cls = index < 2 ? "tag" : "tag neutral";
          return `<span class="${cls}">${escapeHtml(name)}</span>`;
        })
        .join("");

      const followRows = data.followRows
        .map(function(row, index) {
          const key = `${activeType}-${index}`;
          if (removedFollow.has(key)) return "";
          return `<tr>
            <td title="${escapeHtml(row[0])}">${escapeHtml(row[0])}</td>
            <td>${escapeHtml(row[1])}</td>
            <td>${escapeHtml(row[2])}</td>
            <td><button class="link" data-action="remove-follow" data-key="${key}">取消关注</button></td>
          </tr>`;
        })
        .filter(Boolean);
      renderRows(document.getElementById("followRows"), followRows, 4, "暂无该类型关注对象");

      const favoriteRows = data.favoriteRows
        .map(function(row, index) {
          const key = `${activeType}-${index}`;
          if (removedFavorite.has(key)) return "";
          return `<tr>
            <td>${escapeHtml(row[0])}</td>
            <td title="${escapeHtml(row[1])}">${escapeHtml(row[1])}</td>
            <td title="${escapeHtml(row[2])}">${escapeHtml(row[2])}</td>
            <td>${escapeHtml(row[3])}</td>
            <td><span class="status"><span class="dot${dotClass(row[5])}"></span>${escapeHtml(row[4])}</span></td>
            <td><button class="link" data-action="remove-favorite" data-key="${key}">移除收藏</button></td>
          </tr>`;
        })
        .filter(Boolean);
      renderRows(document.getElementById("favoriteRows"), favoriteRows, 6, "暂无该类型收藏记录");
    }

    function getBrowseRowByKey(key) {
      const splitIndex = key.lastIndexOf("-");
      const type = key.slice(0, splitIndex);
      const index = Number(key.slice(splitIndex + 1));
      const row = typeData[type] && typeData[type].browseRows[index];
      return row ? { type, index, row } : null;
    }

    function openDetail(key) {
      const item = getBrowseRowByKey(key);
      if (!item) return;
      currentDetailKey = key;
      const row = item.row;
      document.getElementById("detailTitle").textContent = row[1];
      document.getElementById("detailType").textContent = row[0];
      document.getElementById("detailSource").textContent = row[2];
      document.getElementById("detailTime").textContent = row[3];
      document.getElementById("detailSummary").textContent = `该条记录来自用户浏览行为，可用于用户自己回看历史内容。系统推荐规则和算法参数不在个人中心开放配置，统一由后台推荐配置维护。`;
      document.getElementById("detailDrawer").classList.add("open");
      document.getElementById("detailDrawer").setAttribute("aria-hidden", "false");
    }

    function closeDetail() {
      document.getElementById("detailDrawer").classList.remove("open");
      document.getElementById("detailDrawer").setAttribute("aria-hidden", "true");
      currentDetailKey = "";
    }

    function activateAccountTab(sectionId) {
      document.querySelectorAll(".inner-tabs .tab").forEach(function(tab) {
        tab.classList.toggle("active", tab.dataset.section === sectionId);
      });
      if (sectionId === "profile") {
        document.querySelector(".section-head h2").textContent = "基本信息";
        document.querySelector(".section-head .muted").textContent = "基础资料仍沿用账号中心原有表单；本页重点展示收藏、浏览和关注数据。";
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      const titleMap = {
        favoriteSection: "我的收藏",
        browseSection: "浏览记录",
        followSection: "我的关注"
      };
      document.querySelector(".section-head h2").textContent = titleMap[sectionId] || "我的收藏";
      document.querySelector(".section-head .muted").textContent = "展示用户自己收藏、浏览和关注的数据；推荐规则、触达策略和算法参数由后台统一配置。";
      const target = document.getElementById(sectionId);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.querySelectorAll(".category").forEach(function(item) {
      item.addEventListener("click", function() {
        activeType = item.dataset.type;
        renderPage();
      });
    });

    document.querySelectorAll(".inner-tabs .tab").forEach(function(tab) {
      tab.addEventListener("click", function() {
        activateAccountTab(tab.dataset.section);
      });
    });

    document.getElementById("browseTypeFilter").addEventListener("change", function(event) {
      activeType = event.target.value;
      renderPage();
    });

    document.getElementById("favoriteTypeFilter").addEventListener("change", function(event) {
      activeType = event.target.value;
      renderPage();
    });

    document.getElementById("clearBrowseBtn").addEventListener("click", function() {
      typeData[activeType].browseRows.forEach(function(_, index) {
        removedBrowse.add(`${activeType}-${index}`);
      });
      renderPage();
    });

    document.addEventListener("click", function(event) {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      if (target.dataset.action === "open-detail") openDetail(target.dataset.key);
      if (target.dataset.action === "remove-browse") removedBrowse.add(target.dataset.key);
      if (target.dataset.action === "remove-favorite") removedFavorite.add(target.dataset.key);
      if (target.dataset.action === "remove-follow") removedFollow.add(target.dataset.key);
      renderPage();
    });

    document.getElementById("closeDrawer").addEventListener("click", closeDetail);
    document.getElementById("detailDrawer").addEventListener("click", function(event) {
      if (event.target.id === "detailDrawer") closeDetail();
    });

      if (currentDetailKey) removedBrowse.add(currentDetailKey);
      closeDetail();
      renderPage();
    });

    renderPage();
  </script>
</body>
