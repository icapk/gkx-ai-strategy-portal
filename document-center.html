<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="智慧服务门户文档中心，提供门户入门、资源检索、服务访问与消息待办使用指南。">
  <title>文档中心 · 智慧服务门户</title>
  <style>
    :root { --blue:#006eff; --ink:#242933; --muted:#7c8490; --line:#e8ebf0; --sidebar:#f5f7fa; --blue-soft:#f2f6ff; --sidebar-width:252px; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html { min-width:1100px; scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:#fff; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:default; }
    button { color:inherit; }
    button:focus-visible,a:focus-visible,button[aria-current]:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    svg { width:19px; height:19px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
    .skip-link { position:fixed; top:-60px; left:280px; z-index:5; padding:10px 16px; background:white; border:1px solid var(--blue); }
    .skip-link:focus { top:10px; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar-width); display:flex; flex-direction:column; background:var(--sidebar); border-right:1px solid var(--line); }
    .sidebar-brand { display:flex; align-items:center; gap:9px; padding:23px 19px 18px; font-size:18px; font-weight:600; }
    .sidebar-brand > svg { width:21px; height:21px; }
    .icon-button { border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:4px; color:var(--muted); }
    .icon-button:hover { color:var(--blue); background:#e9eef6; }
    .search-box { display:flex; align-items:center; height:38px; margin:0 18px 18px; padding:0 10px; gap:8px; background:#fff; border:1px solid #e0e5ed; }
    .search-box:focus-within { border-color:var(--blue); }
    .search-box > svg { width:17px; height:17px; color:#59616d; }
    .search-box input { min-width:0; width:100%; outline:0; border:0; background:transparent; color:var(--ink); font-size:13px; }
    .search-box input::-webkit-search-cancel-button { display:none; }
    .search-box .icon-button { width:20px; height:24px; }
    .search-status { margin:-5px 20px 13px; font-size:12px; color:var(--muted); }
    .doc-navigation { flex:1; min-height:0; overflow-y:auto; padding:0 17px 24px; scrollbar-width:thin; }
    .nav-link { display:block; padding:12px 13px; margin:3px 0; border-left:2px solid transparent; border-radius:0 4px 4px 0; color:#616b78; font-size:14px; line-height:1.7; text-decoration:none; }
    .nav-link:hover { background:#edf1f6; color:var(--blue); text-decoration:none; }
    .nav-link.active { color:var(--blue); border-left-color:var(--blue); background:#edf3ff; font-weight:500; }
    .empty-state { margin:28px 2px; text-align:center; color:var(--muted); font-size:13px; line-height:1.9; }
    .empty-state button { margin-top:10px; border:0; background:transparent; color:var(--blue); }
    .workspace { margin-left:var(--sidebar-width); padding:27px 36px 48px; }
    .reading-layout { display:block; }
    .document { min-width:0; width:100%; }
    h1 { margin:0 0 15px; font-size:30px; line-height:1.45; font-weight:500; color:#22262d; }
    .meta-row { margin-bottom:25px; color:var(--muted); font-size:12px; }
    .article-content { font-size:14px; line-height:1.95; color:#414852; }
    .article-content > p { margin:0 0 20px; }
    .article-content h3 { margin:22px 0 10px; font-size:17px; line-height:1.7; color:#303844; }
    .article-content blockquote { margin:18px 0; padding:10px 18px; border-left:3px solid var(--blue); background:var(--blue-soft); color:#526176; }
    .article-content blockquote p { margin:4px 0; }
    .article-content code { padding:2px 5px; border-radius:3px; background:#f2f4f7; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; }
    .article-content pre { padding:16px; overflow:auto; border:1px solid var(--line); background:#f7f9fc; line-height:1.7; }
    .article-content pre code { padding:0; background:none; }
    .article-content img { max-width:100%; }
    .article-content hr { margin:28px 0; border:0; border-top:1px solid var(--line); }
    .document-status { padding:28px 0; color:var(--muted); line-height:1.8; }
    .document-status button { margin-left:10px; border:0; padding:0; color:var(--blue); background:none; }

    .article-content h2,.article-content h3,.article-content h4 { scroll-margin-top:26px; }
    .article-content h2 { margin:24px 0 12px; color:#232932; font-weight:600; font-size:21px; line-height:1.6; }
    .article-content p { margin:10px 0 14px; }
    .article-content ul,.article-content ol { margin:10px 0 18px; padding-left:22px; }
    .article-content li { padding-left:3px; margin:5px 0; }
    .article-content strong { font-weight:600; color:#343b45; }
    table { width:100%; margin:17px 0 20px; border-collapse:collapse; font-size:13px; line-height:1.8; }
    th,td { padding:11px 14px; border:1px solid #e4e8ef; text-align:left; vertical-align:top; }
    th { background:#f7f9fc; font-weight:500; color:#3b4555; }
    td:first-child { width:24%; color:#3a4556; }
    .next-docs { display:flex; justify-content:space-between; gap:20px; border-top:1px solid var(--line); margin-top:38px; padding-top:23px; }
    .next-docs a { display:flex; flex-direction:column; gap:7px; font-size:13px; }
    .next-docs a:last-child { margin-left:auto; text-align:right; }
    .next-docs span { color:#929ba7; font-size:12px; }
    .document-footer { margin-top:32px; color:#9aa2ad; font-size:11px; }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
    @media print {
      html { min-width:0; } .sidebar,.skip-link,.next-docs { display:none !important; }
      .workspace { margin:0; padding:0; } .reading-layout { display:block; } .document { max-width:none; } .meta-row { margin-bottom:20px; }
      .article-content { break-inside:auto; } h2 { break-after:avoid; } tr,blockquote { break-inside:avoid; } a { color:inherit; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#article">跳转到文档正文</a>
  <aside class="sidebar" aria-label="文档导航">
    <div class="sidebar-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h5v15h-4a4 4 0 0 0-4 2"/></svg><span>文档中心</span></div>
    <label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="directorySearch" type="search" placeholder="搜索系统名称" aria-label="搜索系统名称" autocomplete="off"><button id="clearSearch" class="icon-button" type="button" aria-label="清空搜索" hidden>×</button></label>
    <p id="searchStatus" class="search-status" role="status" hidden></p>
    <nav id="docNavigation" class="doc-navigation" aria-label="文档目录"></nav>
  </aside>
  <main class="workspace">
    <div class="reading-layout">
      <article class="document" id="article" tabindex="-1">
        <h1 id="documentTitle"></h1>
        <div class="meta-row"><span id="documentUpdated"></span></div>
        <div class="document-status" id="documentStatus" role="status">正在加载文档…</div>
        <div class="article-content" id="articleContent"></div>
        <nav class="next-docs" id="nextDocs" aria-label="相邻文档"></nav>
        <footer class="document-footer">智慧服务门户使用指南 · 示例内容</footer>
      </article>
    </div>
  </main>
  <script src="assets/vendor/marked-18.0.12.min.js"></script>
  <script src="assets/vendor/purify-3.4.15.min.js"></script>
  <script src="document-center.js?v=20260909-doc-cleanup"></script>
</body>
</html>
