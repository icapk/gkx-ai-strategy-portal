<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>门户待办中心原型</title>
  <link rel="stylesheet" href="portal-extras.css">
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      font-size: 14px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: transparent; }
    button { font: inherit; cursor: pointer; }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, .38);
    }

    .ticket-popup {
      width: min(920px, calc(100vw - 36px));
      height: min(680px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 72px rgba(15, 23, 42, .24);
    }

    .ticket-content {
      margin: 10px 0 0;
      color: #5d687a;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .ticket-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
    }

    .ticket-footer .portal-message-meta { margin-top: 0; }
    .ticket-number { color: #8791a1; font-size: 12px; }
    .ticket-status.done { color: #52806d; background: #edf6f1; }
    .ticket-process { flex-shrink: 0; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 20;
      max-width: calc(100vw - 48px);
      padding: 10px 14px;
      border-radius: 6px;
      color: #fff;
      background: #111827;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .22);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 760px) {
      .overlay { padding: 0; place-items: stretch; }
      .ticket-popup { width: 100vw; height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="overlay" id="ticketOverlay">
    <section class="ticket-popup" role="dialog" aria-modal="true" aria-labelledby="ticketServiceTitle">
      <header class="portal-message-head">
        <div class="portal-message-head-row">
          <div class="portal-message-title-wrap">
            <span class="portal-message-bell" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m8 8 1 1 2-2M13 8h3M8 13h8M8 17h8"></path></svg>
            </span>
            <div>
              <h1 class="portal-message-title" id="ticketServiceTitle">待办中心</h1>
              <p class="portal-message-subtitle">查看工单标题与内容，处理待办事项</p>
            </div>
          </div>
          <button class="portal-message-close close" type="button" title="关闭" aria-label="关闭待办中心">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
          </button>
        </div>
      </header>

      <div class="portal-message-toolbar">
        <div class="portal-message-tabs" id="tabs" aria-label="工单状态筛选">
          <button class="portal-message-tab" type="button" data-status="pending" aria-pressed="true">待处理 <span class="portal-message-tab-count" data-count="pending">0</span></button>
          <button class="portal-message-tab" type="button" data-status="done" aria-pressed="false">已处理 <span class="portal-message-tab-count" data-count="done">0</span></button>
        </div>
      </div>

      <div class="portal-message-list-wrap">
        <div class="portal-message-list" id="ticketList" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const tickets = [
      {
        id: "TK20260819003",
        title: "低空经济报告下载后无法打开",
        desc: "在新型高端智库中生成的低空经济报告下载后提示文件损坏，希望确认是否可以重新生成。",
        status: "done",
        time: "2026-08-19 10:22"
      },
      {
        id: "TK20260818002",
        title: "企业是否符合人工智能专项申报条件",
        desc: "企业主营业务为工业视觉检测，想确认是否符合 2026 年人工智能专项申报范围。",
        status: "done",
        time: "2026-08-18 15:40"
      },
      {
        id: "TK20260817001",
        title: "无法查看某智库报告详情",
        desc: "点击量子计算专题报告后提示无权限，需确认是否和机构账号授权有关。",
        status: "pending",
        time: "2026-08-17 09:18"
      }
    ];

    const statusMap = { pending: "待处理", done: "已处理" };
    let currentStatus = "pending";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      })[character]);
    }

    function render() {
      document.querySelectorAll("[data-status]").forEach((button) => {
        const selected = button.dataset.status === currentStatus;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-pressed", String(selected));
        button.querySelector("[data-count]").textContent = tickets.filter((ticket) => ticket.status === button.dataset.status).length;
      });

      const list = tickets.filter((ticket) => ticket.status === currentStatus);
      document.getElementById("ticketList").innerHTML = list.length ? list.map((ticket) => `
        <article class="portal-message-card">
          <div class="portal-message-card-head">
            <h2 class="portal-message-card-title">${escapeHtml(ticket.title)}</h2>
            <time class="portal-message-time" datetime="${escapeHtml(ticket.time.replace(" ", "T"))}">${escapeHtml(ticket.time)}</time>
          </div>
          <p class="ticket-content">${escapeHtml(ticket.desc)}</p>
          <div class="ticket-footer">
            <div class="portal-message-meta">
              <span class="portal-message-tag ticket-status ${escapeHtml(ticket.status)}">${escapeHtml(statusMap[ticket.status])}</span>
              <span class="ticket-number">${escapeHtml(ticket.id)}</span>
            </div>
            ${ticket.status === "pending" ? `
              <button class="portal-message-link ticket-process" type="button" data-process-id="${escapeHtml(ticket.id)}">
                去处理 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg>
              </button>
            ` : `
              <button class="portal-message-link ticket-process" type="button" data-view-id="${escapeHtml(ticket.id)}">
                去查看 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"></path></svg>
              </button>
            `}
          </div>
        </article>
      `).join("") : `<div class="portal-message-empty">暂无${escapeHtml(statusMap[currentStatus])}事项</div>`;
    }

    document.getElementById("tabs").addEventListener("click", (event) => {
      const button = event.target.closest("[data-status]");
      if (!button) return;
      currentStatus = button.dataset.status;
      render();
      document.querySelector(".portal-message-list-wrap").scrollTop = 0;
    });

    document.getElementById("ticketList").addEventListener("click", (event) => {
      const button = event.target.closest("[data-process-id], [data-view-id]");
      if (!button) return;
      // 示例数据尚无来源系统处理或查看地址；点击不改变工单状态。
      showToast(button.hasAttribute("data-view-id") ? "暂未配置该工单的查看地址" : "暂未配置该工单的处理地址");
    });

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function requestClose() {
      if (window.parent !== window) {
        const parentOrigin = window.location.origin === "null" ? "*" : window.location.origin;
        window.parent.postMessage({ type: "gkx-ticket-service-close" }, parentOrigin);
      } else {
        showToast("关闭待办中心");
      }
    }

    document.querySelector(".close").addEventListener("click", requestClose);
    document.getElementById("ticketOverlay").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) requestClose();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") requestClose();
    });

    render();
  </script>
</body>
</html>
