  <script>
    (() => {
      const assetOrigin = "https://intelligent-research-reading-portal.thechosenonekk07.chatgpt.site";
      const resolveAsset = (value) => {
        if (typeof value !== "string") return value;
        if (value.startsWith("/assets/")) return assetOrigin + value;
        if (value.startsWith("./assets/")) return assetOrigin + value.slice(1);
        return value;
      };
      const nativeSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function (name, value) {
        if (name === "src") value = resolveAsset(value);
        return nativeSetAttribute.call(this, name, value);
      };

      const imageSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, "src");
      if (imageSrc?.set && imageSrc.get) {
        Object.defineProperty(HTMLImageElement.prototype, "src", {
          configurable: true,
          enumerable: imageSrc.enumerable,
          get: imageSrc.get,
          set(value) {
            imageSrc.set.call(this, resolveAsset(value));
          }
        });
      }

      if (new URLSearchParams(location.search).get("view") === "reading") {

          if (!button) return false;
          button.click();
          return true;
        };
        const observer = new MutationObserver(() => {
          if (selectReading()) observer.disconnect();
        });
        document.addEventListener("DOMContentLoaded", () => {
          observer.observe(document.body, { childList: true, subtree: true });
          selectReading();
